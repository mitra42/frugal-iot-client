A bridge relays a Pi's readings to this server, so its nodes appear here too, while the Pi carries on recording and serving on its own whenever the link is down. "Bridge" is the broker's live view of the relay; "Last check-in" is when that Pi last collected this organization's logins, which it does over HTTP - so a Pi can be checking in while its bridge is down, and the two together say which half is broken.: Uma ponte retransmite as leituras de um Pi para este servidor, para que os nós dele apareçam aqui também, enquanto o Pi continua gravando e servindo por conta própria sempre que a conexão cai. “Ponte” é a visão ao vivo da retransmissão pelo broker; “Último contato” é quando esse Pi buscou pela última vez os logins desta organização, o que ele faz por HTTP - então um Pi pode estar fazendo contato enquanto sua ponte está fora do ar, e os dois juntos dizem qual metade está com defeito.
