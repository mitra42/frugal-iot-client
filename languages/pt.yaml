'Put these lines in the configuration file of the OpenSearch Dashboards on your computer (opensearch_dashboards.yml), then restart it. Nothing is asked for when you open it: the login is in the file. The password is not kept anywhere you can read it, so if you lose this, press the button below to make a new one and paste the lines in again.': 'Coloque estas linhas no arquivo de configuração do OpenSearch Dashboards no seu computador (opensearch_dashboards.yml) e reinicie-o. Nada é pedido quando você o abre: o login está no arquivo. A senha não fica guardada em nenhum lugar onde você possa lê-la, então se você a perder, pressione o botão abaixo para criar uma nova e cole as linhas de novo.'
'Grafana can chart this organization''s readings straight from the server - every reading ever recorded, with nothing to export first. To set it up: install the Infinity plugin in Grafana, make a token here, give Grafana the data source, then import the dashboard. A token is yours: it lets one Grafana read what you can read in this organization, and stops working if your access to it does.': 'O Grafana pode fazer gráficos das leituras desta organização direto do servidor - todas as leituras já gravadas, sem precisar exportar nada antes. Para configurar: instale o plugin Infinity no Grafana, crie um token aqui, passe a fonte de dados ao Grafana e depois importe o painel. Um token é seu: ele permite que um Grafana leia o que você pode ler nesta organização, e deixa de funcionar se o seu acesso deixar.'
