'Two credentials for two different connections: the password is what the MQTT bridge logs in with on port 8883, and the token is what lets that Pi pull this organization''s logins over HTTPS, so the same people can log in there too. The token can be skipped - press Enter at its prompt - and added later by doing this again. Neither is asked for on the command line, so that neither ends up in the Pi''s shell history.': 'Duas credenciais para duas conexões diferentes: a senha é aquela com que a ponte MQTT faz login na porta 8883, e o token é o que permite a esse Pi buscar os logins desta organização por HTTPS, para que as mesmas pessoas possam fazer login lá também. O token pode ser pulado - pressione Enter quando ele for pedido - e adicionado depois repetindo isto. Nenhum dos dois é pedido na linha de comando, para que nenhum fique no histórico do shell do Pi.'
