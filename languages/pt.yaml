OpenSearch Dashboards is a program you run on your own computer to search and chart this organization's readings, which this server keeps in OpenSearch. It needs a login, made here, that is yours. It can read this organization's readings and nothing else, and the people of an organization share its saved dashboards. It needs permission to read the whole organization; if you can read only some projects, use the Grafana card instead.: O OpenSearch Dashboards é um programa que você roda no seu próprio computador para pesquisar e fazer gráficos das leituras desta organização, que este servidor guarda no OpenSearch. Ele precisa de um login, criado aqui, que é seu. Ele pode ler as leituras desta organização e nada mais, e as pessoas de uma organização compartilham os painéis salvos dela. É preciso ter permissão para ler a organização inteira; se você só pode ler alguns projetos, use o cartão do Grafana.
