Readings are always recorded in the CSV files, and charted in Grafana from them. A forwarder also sends each reading, as it is logged, somewhere else - OpenSearch to search and browse them, or Google Sheets to add a row of values every so often. Changes apply straight away.: Les mesures sont toujours enregistrées dans les fichiers CSV, et tracées dans Grafana à partir de ceux-ci. Un transfert envoie aussi chaque mesure, au moment où elle est enregistrée, ailleurs - vers OpenSearch pour les rechercher et les parcourir, ou vers Google Sheets pour ajouter une ligne de valeurs de temps en temps. Les changements s'appliquent immédiatement.
