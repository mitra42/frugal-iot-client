OpenSearch Dashboards is a program you run on your own computer to search and chart this organization's readings, which this server keeps in OpenSearch. It needs a login, made here, that is yours. It can read this organization's readings and nothing else, and the people of an organization share its saved dashboards. It needs permission to read the whole organization; if you can read only some projects, use the Grafana card instead.: OpenSearch Dashboards est un programme que vous exécutez sur votre propre ordinateur pour rechercher et tracer les mesures de cette organisation, que ce serveur conserve dans OpenSearch. Il a besoin d'un identifiant, créé ici, qui vous est propre. Il peut lire les mesures de cette organisation et rien d'autre, et les membres d'une organisation partagent ses tableaux de bord enregistrés. Il faut l'autorisation de lire toute l'organisation ; si vous ne pouvez lire que certains projets, utilisez plutôt la carte Grafana.
