'Put these lines in the configuration file of the OpenSearch Dashboards on your computer (opensearch_dashboards.yml), then restart it. Nothing is asked for when you open it: the login is in the file. The password is not kept anywhere you can read it, so if you lose this, press the button below to make a new one and paste the lines in again.': 'Mettez ces lignes dans le fichier de configuration d''OpenSearch Dashboards sur votre ordinateur (opensearch_dashboards.yml), puis redémarrez-le. Rien ne vous est demandé à l''ouverture : l''identifiant est dans le fichier. Le mot de passe n''est conservé nulle part où vous pourriez le lire ; si vous le perdez, appuyez sur le bouton ci-dessous pour en créer un nouveau et collez à nouveau les lignes.'
'Grafana can chart this organization''s readings straight from the server - every reading ever recorded, with nothing to export first. To set it up: install the Infinity plugin in Grafana, make a token here, give Grafana the data source, then import the dashboard. A token is yours: it lets one Grafana read what you can read in this organization, and stops working if your access to it does.': 'Grafana peut tracer les mesures de cette organisation directement depuis le serveur - toutes les mesures jamais enregistrées, sans rien exporter d''abord. Pour le configurer : installez le plugin Infinity dans Grafana, créez un jeton ici, donnez à Grafana la source de données, puis importez le tableau de bord. Un jeton est à vous : il permet à un Grafana de lire ce que vous pouvez lire dans cette organisation, et cesse de fonctionner si votre accès cesse.'
Download the dashboard: Télécharger le tableau de bord
