'Put these lines in the configuration file of the OpenSearch Dashboards on your computer (opensearch_dashboards.yml), then restart it. Nothing is asked for when you open it: the login is in the file. The password is not kept anywhere you can read it, so if you lose this, press the button below to make a new one and paste the lines in again.': 'इन पंक्तियों को अपने कंप्यूटर पर OpenSearch Dashboards की कॉन्फ़िगरेशन फ़ाइल (opensearch_dashboards.yml) में डालें, फिर उसे पुनः आरंभ करें। खोलने पर कुछ नहीं पूछा जाता: लॉगिन फ़ाइल में है। पासवर्ड कहीं ऐसी जगह नहीं रखा जाता जहाँ आप उसे पढ़ सकें, इसलिए यदि यह खो जाए तो नीचे दिया बटन दबाकर नया बनाएँ और पंक्तियाँ फिर से चिपकाएँ।'
'Grafana can chart this organization''s readings straight from the server - every reading ever recorded, with nothing to export first. To set it up: install the Infinity plugin in Grafana, make a token here, give Grafana the data source, then import the dashboard. A token is yours: it lets one Grafana read what you can read in this organization, and stops working if your access to it does.': 'Grafana इस संगठन की रीडिंग सीधे सर्वर से चार्ट कर सकता है - अब तक दर्ज हर रीडिंग, पहले कुछ निर्यात किए बिना। इसे सेट करने के लिए: Grafana में Infinity प्लगइन इंस्टॉल करें, यहाँ एक टोकन बनाएँ, Grafana को डेटा स्रोत दें, फिर डैशबोर्ड आयात करें। टोकन आपका होता है: यह एक Grafana को वह पढ़ने देता है जो आप इस संगठन में पढ़ सकते हैं, और आपकी पहुँच समाप्त होने पर काम करना बंद कर देता है।'
