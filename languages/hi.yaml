OpenSearch Dashboards is a program you run on your own computer to search and chart this organization's readings, which this server keeps in OpenSearch. It needs a login, made here, that is yours. It can read this organization's readings and nothing else, and the people of an organization share its saved dashboards. It needs permission to read the whole organization; if you can read only some projects, use the Grafana card instead.: OpenSearch Dashboards एक प्रोग्राम है जिसे आप अपने कंप्यूटर पर चलाकर इस संगठन की रीडिंग खोज और चार्ट कर सकते हैं, जिन्हें यह सर्वर OpenSearch में रखता है। इसके लिए यहाँ बनाया गया एक लॉगिन चाहिए, जो आपका अपना हो। यह इस संगठन की रीडिंग पढ़ सकता है और कुछ नहीं, और संगठन के लोग इसके सहेजे गए डैशबोर्ड साझा करते हैं। इसके लिए पूरे संगठन को पढ़ने की अनुमति चाहिए; यदि आप केवल कुछ परियोजनाएँ पढ़ सकते हैं, तो इसके बजाय Grafana कार्ड का उपयोग करें।
