'Put these lines in the configuration file of the OpenSearch Dashboards on your computer (opensearch_dashboards.yml), then restart it. Nothing is asked for when you open it: the login is in the file. The password is not kept anywhere you can read it, so if you lose this, press the button below to make a new one and paste the lines in again.': 'Pon estas líneas en el archivo de configuración de OpenSearch Dashboards en tu computadora (opensearch_dashboards.yml) y luego reinícialo. No se pide nada al abrirlo: el inicio de sesión está en el archivo. La contraseña no se guarda en ningún lugar donde puedas leerla, así que si la pierdes, pulsa el botón de abajo para crear una nueva y vuelve a pegar las líneas.'
'Grafana can chart this organization''s readings straight from the server - every reading ever recorded, with nothing to export first. To set it up: install the Infinity plugin in Grafana, make a token here, give Grafana the data source, then import the dashboard. A token is yours: it lets one Grafana read what you can read in this organization, and stops working if your access to it does.': 'Grafana puede graficar las lecturas de esta organización directamente desde el servidor: todas las lecturas registradas, sin exportar nada antes. Para configurarlo: instala el plugin Infinity en Grafana, crea un token aquí, dale a Grafana la fuente de datos y luego importa el panel. Un token es tuyo: permite que un Grafana lea lo que tú puedes leer en esta organización, y deja de funcionar si tu acceso deja de hacerlo.'
