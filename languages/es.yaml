A bridge relays a Pi's readings to this server, so its nodes appear here too, while the Pi carries on recording and serving on its own whenever the link is down. "Bridge" is the broker's live view of the relay; "Last check-in" is when that Pi last collected this organization's logins, which it does over HTTP - so a Pi can be checking in while its bridge is down, and the two together say which half is broken.: Un puente retransmite las lecturas de un Pi a este servidor, así que sus nodos también aparecen aquí, mientras el Pi sigue registrando y sirviendo por su cuenta siempre que el enlace esté caído. "Puente" es la vista en vivo del bróker sobre la retransmisión; "Último contacto" es cuándo ese Pi recogió por última vez los inicios de sesión de esta organización, lo que hace por HTTP; así que un Pi puede estar haciendo contacto mientras su puente está caído, y ambos juntos indican qué mitad falla.
