'Two credentials for two different connections: the password is what the MQTT bridge logs in with on port 8883, and the token is what lets that Pi pull this organization''s logins over HTTPS, so the same people can log in there too. The token can be skipped - press Enter at its prompt - and added later by doing this again. Neither is asked for on the command line, so that neither ends up in the Pi''s shell history.': 'Dos credenciales para dos conexiones distintas: la contraseña es con la que el puente MQTT inicia sesión en el puerto 8883, y el token es lo que permite a ese Pi obtener los inicios de sesión de esta organización por HTTPS, para que las mismas personas también puedan iniciar sesión allí. El token se puede omitir - pulsa Intro cuando lo pida - y agregarlo más tarde repitiendo esto. Ninguno se pide en la línea de comandos, para que ninguno quede en el historial del shell del Pi.'
