OpenSearch Dashboards is a program you run on your own computer to search and chart this organization's readings, which this server keeps in OpenSearch. It needs a login, made here, that is yours. It can read this organization's readings and nothing else, and the people of an organization share its saved dashboards. It needs permission to read the whole organization; if you can read only some projects, use the Grafana card instead.: OpenSearch Dashboards ni programu unayoiendesha kwenye kompyuta yako mwenyewe kutafuta na kuchora vipimo vya shirika hili, ambavyo seva hii huvihifadhi katika OpenSearch. Inahitaji akaunti ya kuingia, inayotengenezwa hapa, ambayo ni yako. Inaweza kusoma vipimo vya shirika hili na si kitu kingine, na watu wa shirika hushiriki dashibodi zake zilizohifadhiwa. Inahitaji ruhusa ya kusoma shirika zima; ikiwa unaweza kusoma baadhi ya miradi tu, tumia kadi ya Grafana badala yake.
Give a Grafana access: Ipe Grafana ruhusa ya kufikia
Name it for whoever or wherever it is, so it can be revoked on its own.: Ipe jina la mtu au mahali inapotumika, ili iweze kubatilishwa peke yake.
Make a token: Tengeneza token
The starter dashboard: Dashibodi ya kuanzia
A chart with a list of every topic to pick from. In Grafana choose Dashboards, New, Import, upload this file, and pick the data source above when it asks.: Chati yenye orodha ya kila mada ya kuchagua. Kwenye Grafana chagua Dashboards, New, Import, pakia faili hii, na uchague chanzo cha data kilicho hapo juu inapouliza.
