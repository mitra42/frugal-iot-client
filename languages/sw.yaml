A bridge relays a Pi's readings to this server, so its nodes appear here too, while the Pi carries on recording and serving on its own whenever the link is down. "Bridge" is the broker's live view of the relay; "Last check-in" is when that Pi last collected this organization's logins, which it does over HTTP - so a Pi can be checking in while its bridge is down, and the two together say which half is broken.: Daraja hupeleka vipimo vya Pi kwenye seva hii, hivyo nodi zake zinaonekana hapa pia, huku Pi ikiendelea kurekodi na kuhudumia yenyewe kila kiungo kinapokatika. "Daraja" ni mwonekano wa moja kwa moja wa broker kuhusu upelekaji huo; "Mawasiliano ya mwisho" ni wakati Pi hiyo ilipochukua mara ya mwisho akaunti za kuingia za shirika hili, jambo inalofanya kupitia HTTP - kwa hiyo Pi inaweza kuwa inawasiliana wakati daraja lake limekatika, na viwili hivyo kwa pamoja vinaonyesha nusu ipi imeharibika.
