'Sends the readings already recorded in the CSV files, which this forwarder did not see because it was off or OpenSearch was down. It is safe to repeat: a reading already there is replaced, not doubled.': 'Hutuma vipimo vilivyokwisha rekodiwa kwenye faili za CSV, ambavyo kipelekaji hiki hakikuviona kwa sababu kilikuwa kimezimwa au OpenSearch haikuwa ikifanya kazi. Ni salama kurudia: kipimo kilichopo tayari kinabadilishwa, si kurudufishwa.'
