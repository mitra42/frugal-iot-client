Make a login: Tengeneza akaunti ya kuingia
'Put these lines in the configuration file of the OpenSearch Dashboards on your computer (opensearch_dashboards.yml), then restart it. Nothing is asked for when you open it: the login is in the file. The password is not kept anywhere you can read it, so if you lose this, press the button below to make a new one and paste the lines in again.': 'Weka mistari hii kwenye faili ya usanidi ya OpenSearch Dashboards kwenye kompyuta yako (opensearch_dashboards.yml), kisha iwashe upya. Hakuna kinachoulizwa unapoifungua: akaunti ya kuingia iko ndani ya faili. Nenosiri halihifadhiwi mahali popote unapoweza kulisoma, kwa hiyo ukipoteza hii, bonyeza kitufe kilicho hapa chini kutengeneza jipya na ubandike mistari tena.'
'Grafana can chart this organization''s readings straight from the server - every reading ever recorded, with nothing to export first. To set it up: install the Infinity plugin in Grafana, make a token here, give Grafana the data source, then import the dashboard. A token is yours: it lets one Grafana read what you can read in this organization, and stops working if your access to it does.': 'Grafana inaweza kuchora vipimo vya shirika hili moja kwa moja kutoka kwa seva - kila kipimo kilichowahi kurekodiwa, bila kuhamisha chochote kwanza. Kuisanidi: sakinisha plugin ya Infinity kwenye Grafana, tengeneza token hapa, ipe Grafana chanzo cha data, kisha ingiza dashibodi. Token ni yako: inaruhusu Grafana moja kusoma unachoweza kusoma katika shirika hili, na inaacha kufanya kazi ikiwa ruhusa yako inakoma.'
