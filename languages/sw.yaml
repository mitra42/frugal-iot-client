'Two credentials for two different connections: the password is what the MQTT bridge logs in with on port 8883, and the token is what lets that Pi pull this organization''s logins over HTTPS, so the same people can log in there too. The token can be skipped - press Enter at its prompt - and added later by doing this again. Neither is asked for on the command line, so that neither ends up in the Pi''s shell history.': 'Vitambulisho viwili kwa miunganisho miwili tofauti: nenosiri ndilo daraja la MQTT hutumia kuingia kwenye port 8883, na token ndiyo inayoruhusu Pi hiyo kuvuta akaunti za kuingia za shirika hili kupitia HTTPS, ili watu wale wale waweze kuingia huko pia. Token inaweza kurukwa - bonyeza Enter inapoulizwa - na kuongezwa baadaye kwa kufanya hivi tena. Hakuna kati ya hivyo kinachoombwa kwenye mstari wa amri, ili kisiishie kwenye historia ya shell ya Pi.'
