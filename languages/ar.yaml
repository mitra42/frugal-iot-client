'Put these lines in the configuration file of the OpenSearch Dashboards on your computer (opensearch_dashboards.yml), then restart it. Nothing is asked for when you open it: the login is in the file. The password is not kept anywhere you can read it, so if you lose this, press the button below to make a new one and paste the lines in again.': 'ضع هذه الأسطر في ملف إعدادات OpenSearch Dashboards على حاسوبك (opensearch_dashboards.yml)، ثم أعد تشغيله. لن يُطلب منك شيء عند فتحه: حساب الدخول موجود في الملف. لا تُحفظ كلمة المرور في أي مكان يمكنك قراءتها منه، فإن فقدت هذا، اضغط الزر أدناه لإنشاء واحدة جديدة والصق الأسطر مرة أخرى.'
'Grafana can chart this organization''s readings straight from the server - every reading ever recorded, with nothing to export first. To set it up: install the Infinity plugin in Grafana, make a token here, give Grafana the data source, then import the dashboard. A token is yours: it lets one Grafana read what you can read in this organization, and stops working if your access to it does.': 'يستطيع Grafana رسم قراءات هذه المؤسسة مباشرة من الخادم - كل قراءة سُجّلت على الإطلاق، دون تصدير أي شيء أولًا. لإعداده: ثبّت إضافة Infinity في Grafana، وأنشئ رمزًا هنا، وأعطِ Grafana مصدر البيانات، ثم استورد اللوحة. الرمز خاص بك: يسمح لـ Grafana واحد بقراءة ما تستطيع قراءته في هذه المؤسسة، ويتوقف عن العمل إن توقف وصولك إليها.'
