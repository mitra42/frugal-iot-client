(Max 4MB, .bin only, typically frugal-iot.ino.bin or firmware.bin): (الحد الأقصى 4 ميغابايت، ملفات .bin فقط، عادةً frugal-iot.ino.bin أو firmware.bin)
A bridge relays a Pi's readings to this server, so its nodes appear here too, while the Pi carries on recording and serving on its own whenever the link is down. "Bridge" is the broker's live view of the relay; "Last check-in" is when that Pi last collected this organization's logins, which it does over HTTP - so a Pi can be checking in while its bridge is down, and the two together say which half is broken.: يرحّل الجسر قراءات جهاز Pi إلى هذا الخادم، فتظهر عُقده هنا أيضًا، بينما يواصل Pi التسجيل والخدمة بمفرده كلما انقطع الاتصال. "الجسر" هو عرض الوسيط المباشر للترحيل؛ و"آخر اتصال" هو آخر مرة جمع فيها ذلك الـ Pi حسابات هذه المؤسسة، وهو ما يفعله عبر HTTP - لذا قد يتصل Pi بينما جسره متوقف، ومعًا يبيّنان أي النصفين معطّل.
