OpenSearch Dashboards is a program you run on your own computer to search and chart this organization's readings, which this server keeps in OpenSearch. It needs a login, made here, that is yours. It can read this organization's readings and nothing else, and the people of an organization share its saved dashboards. It needs permission to read the whole organization; if you can read only some projects, use the Grafana card instead.: OpenSearch Dashboards برنامج تشغّله على حاسوبك للبحث في قراءات هذه المؤسسة ورسمها، والتي يحفظها هذا الخادم في OpenSearch. يحتاج إلى حساب دخول خاص بك، يُنشأ هنا. يمكنه قراءة قراءات هذه المؤسسة ولا شيء غيرها، ويتشارك أعضاء المؤسسة لوحاته المحفوظة. يحتاج إلى صلاحية قراءة المؤسسة كلها؛ وإن كنت تستطيع قراءة بعض المشاريع فقط، فاستخدم بطاقة Grafana بدلًا منه.
