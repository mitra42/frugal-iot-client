'Two credentials for two different connections: the password is what the MQTT bridge logs in with on port 8883, and the token is what lets that Pi pull this organization''s logins over HTTPS, so the same people can log in there too. The token can be skipped - press Enter at its prompt - and added later by doing this again. Neither is asked for on the command line, so that neither ends up in the Pi''s shell history.': 'بيانات اعتماد لاتصالين مختلفين: كلمة المرور هي ما يسجّل به جسر MQTT الدخول على المنفذ 8883، والرمز هو ما يسمح لذلك الـ Pi بجلب حسابات هذه المؤسسة عبر HTTPS، ليتمكن الأشخاص أنفسهم من تسجيل الدخول هناك أيضًا. يمكن تخطي الرمز - اضغط Enter عند طلبه - وإضافته لاحقًا بتكرار هذا. لا يُطلب أي منهما في سطر الأوامر، حتى لا ينتهي أي منهما في سجل أوامر الـ Pi.'
