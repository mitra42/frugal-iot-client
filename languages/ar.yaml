Readings are always recorded in the CSV files, and charted in Grafana from them. A forwarder also sends each reading, as it is logged, somewhere else - OpenSearch to search and browse them, or Google Sheets to add a row of values every so often. Changes apply straight away.: تُسجَّل القراءات دائمًا في ملفات CSV، وتُرسم منها في Grafana. يرسل التحويل أيضًا كل قراءة، عند تسجيلها، إلى مكان آخر - إلى OpenSearch للبحث فيها وتصفحها، أو إلى Google Sheets لإضافة صف من القيم بين حين وآخر. تسري التغييرات فورًا.
