OpenSearch Dashboards is a program you run on your own computer to search and chart this organization's readings, which this server keeps in OpenSearch. It needs a login, made here, that is yours. It can read this organization's readings and nothing else, and the people of an organization share its saved dashboards. It needs permission to read the whole organization; if you can read only some projects, use the Grafana card instead.: OpenSearch Dashboards adalah program yang Anda jalankan di komputer sendiri untuk mencari dan menggambarkan pembacaan organisasi ini, yang disimpan server ini di OpenSearch. Program ini memerlukan login milik Anda sendiri, yang dibuat di sini. Program ini dapat membaca pembacaan organisasi ini dan tidak ada yang lain, dan anggota organisasi berbagi dasbor yang disimpannya. Diperlukan izin membaca seluruh organisasi; jika Anda hanya dapat membaca beberapa proyek, gunakan kartu Grafana.
