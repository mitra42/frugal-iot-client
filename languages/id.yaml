'Put these lines in the configuration file of the OpenSearch Dashboards on your computer (opensearch_dashboards.yml), then restart it. Nothing is asked for when you open it: the login is in the file. The password is not kept anywhere you can read it, so if you lose this, press the button below to make a new one and paste the lines in again.': 'Masukkan baris-baris ini ke berkas konfigurasi OpenSearch Dashboards di komputer Anda (opensearch_dashboards.yml), lalu mulai ulang. Tidak ada yang ditanyakan saat Anda membukanya: login ada di berkas itu. Kata sandi tidak disimpan di tempat yang dapat Anda baca, jadi jika hilang, tekan tombol di bawah untuk membuat yang baru dan tempel lagi baris-barisnya.'
'Grafana can chart this organization''s readings straight from the server - every reading ever recorded, with nothing to export first. To set it up: install the Infinity plugin in Grafana, make a token here, give Grafana the data source, then import the dashboard. A token is yours: it lets one Grafana read what you can read in this organization, and stops working if your access to it does.': 'Grafana dapat menggambarkan pembacaan organisasi ini langsung dari server - setiap pembacaan yang pernah dicatat, tanpa perlu mengekspor apa pun terlebih dahulu. Untuk menyiapkannya: pasang plugin Infinity di Grafana, buat token di sini, berikan sumber data ke Grafana, lalu impor dasbornya. Token adalah milik Anda: token memungkinkan satu Grafana membaca apa yang dapat Anda baca di organisasi ini, dan berhenti bekerja jika akses Anda berhenti.'
