'Two credentials for two different connections: the password is what the MQTT bridge logs in with on port 8883, and the token is what lets that Pi pull this organization''s logins over HTTPS, so the same people can log in there too. The token can be skipped - press Enter at its prompt - and added later by doing this again. Neither is asked for on the command line, so that neither ends up in the Pi''s shell history.': 'Dalawang credential para sa dalawang magkaibang koneksyon: ang password ang ginagamit ng MQTT bridge para mag-log in sa port 8883, at ang token ang nagpapahintulot sa Pi na iyon na kunin ang mga login ng organisasyong ito sa HTTPS, para makapag-log in din doon ang parehong mga tao. Puwedeng laktawan ang token - pindutin ang Enter sa prompt nito - at idagdag mamaya sa paggawa nito ulit. Wala sa dalawa ang hinihingi sa command line, para hindi mapunta ang alinman sa shell history ng Pi.'
