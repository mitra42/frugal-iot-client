A bridge relays a Pi's readings to this server, so its nodes appear here too, while the Pi carries on recording and serving on its own whenever the link is down. "Bridge" is the broker's live view of the relay; "Last check-in" is when that Pi last collected this organization's logins, which it does over HTTP - so a Pi can be checking in while its bridge is down, and the two together say which half is broken.: Ipinapasa ng bridge ang mga reading ng isang Pi sa server na ito, kaya lumalabas din dito ang mga node nito, habang patuloy na nagre-record at nagse-serve ang Pi nang mag-isa tuwing putol ang koneksyon. Ang "Bridge" ay ang live na tingin ng broker sa relay; ang "Huling check-in" ay kung kailan huling kinuha ng Pi na iyon ang mga login ng organisasyong ito, na ginagawa nito sa HTTP - kaya puwedeng nagche-check in ang Pi kahit putol ang bridge nito, at sinasabi ng dalawa kung aling kalahati ang sira.
