'Sends the readings already recorded in the CSV files, which this forwarder did not see because it was off or OpenSearch was down. It is safe to repeat: a reading already there is replaced, not doubled.': 'Ipinapadala ang mga reading na naka-record na sa mga CSV file, na hindi nakita ng forwarder na ito dahil naka-off ito o down ang OpenSearch. Ligtas itong ulitin: ang reading na naroon na ay papalitan, hindi madodoble.'
Only count them, send nothing: Bilangin lang, walang ipapadala
Yours: Sa iyo
Another user's: Sa ibang user
'In Grafana, add a data source of type Infinity, with Authentication set to Bearer Token and the token above, and the allowed host above. Or let this do it:': 'Sa Grafana, magdagdag ng data source na Infinity ang uri, na naka-set ang Authentication sa Bearer Token at ang token sa itaas, at ang pinapayagang host sa itaas. O hayaang ito ang gumawa:'
Download the data source file: I-download ang data source file
You have no login yet.: Wala ka pang login.
Replace the password: Palitan ang password
Make a login: Gumawa ng login
'Put these lines in the configuration file of the OpenSearch Dashboards on your computer (opensearch_dashboards.yml), then restart it. Nothing is asked for when you open it: the login is in the file. The password is not kept anywhere you can read it, so if you lose this, press the button below to make a new one and paste the lines in again.': 'Ilagay ang mga linyang ito sa configuration file ng OpenSearch Dashboards sa iyong computer (opensearch_dashboards.yml), saka i-restart ito. Walang hihingin pagbukas mo nito: nasa file ang login. Hindi itinatago ang password kahit saan na mababasa mo, kaya kung mawala mo ito, pindutin ang button sa ibaba para gumawa ng bago at i-paste ulit ang mga linya.'
'Grafana can chart this organization''s readings straight from the server - every reading ever recorded, with nothing to export first. To set it up: install the Infinity plugin in Grafana, make a token here, give Grafana the data source, then import the dashboard. A token is yours: it lets one Grafana read what you can read in this organization, and stops working if your access to it does.': 'Kayang i-chart ng Grafana ang mga reading ng organisasyong ito nang direkta mula sa server - bawat reading na na-record kailanman, nang walang kailangang i-export muna. Para i-set up: i-install ang Infinity plugin sa Grafana, gumawa ng token dito, ibigay sa Grafana ang data source, saka i-import ang dashboard. Sa iyo ang token: pinapayagan nito ang isang Grafana na basahin ang nababasa mo sa organisasyong ito, at hihinto ito sa paggana kapag nawala ang access mo rito.'
