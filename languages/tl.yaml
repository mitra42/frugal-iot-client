OpenSearch Dashboards is a program you run on your own computer to search and chart this organization's readings, which this server keeps in OpenSearch. It needs a login, made here, that is yours. It can read this organization's readings and nothing else, and the people of an organization share its saved dashboards. It needs permission to read the whole organization; if you can read only some projects, use the Grafana card instead.: Ang OpenSearch Dashboards ay programang pinapatakbo mo sa sarili mong computer para maghanap at gumawa ng chart ng mga reading ng organisasyong ito, na itinatago ng server na ito sa OpenSearch. Kailangan nito ng login, na ginagawa dito, na sa iyo. Mababasa nito ang mga reading ng organisasyong ito at wala nang iba, at magkakahati ang mga tao sa isang organisasyon sa mga naka-save na dashboard nito. Kailangan nito ng pahintulot na basahin ang buong organisasyon; kung ilang proyekto lang ang nababasa mo, gamitin na lang ang Grafana card.
