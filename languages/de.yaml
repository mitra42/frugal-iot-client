A bridge relays a Pi's readings to this server, so its nodes appear here too, while the Pi carries on recording and serving on its own whenever the link is down. "Bridge" is the broker's live view of the relay; "Last check-in" is when that Pi last collected this organization's logins, which it does over HTTP - so a Pi can be checking in while its bridge is down, and the two together say which half is broken.: Eine Bridge leitet die Messwerte eines Pi an diesen Server weiter, sodass seine Knoten auch hier erscheinen, während der Pi selbstständig weiter aufzeichnet und bereitstellt, wann immer die Verbindung unterbrochen ist. „Bridge“ ist die Live-Sicht des Brokers auf die Weiterleitung; „Letzter Kontakt“ ist der Zeitpunkt, zu dem dieser Pi zuletzt die Logins dieser Organisation abgeholt hat, was er über HTTP tut - ein Pi kann sich also melden, während seine Bridge ausgefallen ist, und beides zusammen zeigt, welche Hälfte defekt ist.
