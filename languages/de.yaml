'Put these lines in the configuration file of the OpenSearch Dashboards on your computer (opensearch_dashboards.yml), then restart it. Nothing is asked for when you open it: the login is in the file. The password is not kept anywhere you can read it, so if you lose this, press the button below to make a new one and paste the lines in again.': 'Tragen Sie diese Zeilen in die Konfigurationsdatei von OpenSearch Dashboards auf Ihrem Computer ein (opensearch_dashboards.yml) und starten Sie es neu. Beim Öffnen wird nichts abgefragt: Der Login steht in der Datei. Das Passwort wird nirgends lesbar aufbewahrt; wenn Sie es verlieren, drücken Sie die Schaltfläche unten, um ein neues zu erstellen, und fügen Sie die Zeilen erneut ein.'
'Grafana can chart this organization''s readings straight from the server - every reading ever recorded, with nothing to export first. To set it up: install the Infinity plugin in Grafana, make a token here, give Grafana the data source, then import the dashboard. A token is yours: it lets one Grafana read what you can read in this organization, and stops working if your access to it does.': 'Grafana kann die Messwerte dieser Organisation direkt vom Server darstellen - jeden je aufgezeichneten Messwert, ohne vorher etwas zu exportieren. So richten Sie es ein: Installieren Sie das Infinity-Plugin in Grafana, erstellen Sie hier ein Token, geben Sie Grafana die Datenquelle und importieren Sie dann das Dashboard. Ein Token gehört Ihnen: Es lässt ein Grafana lesen, was Sie in dieser Organisation lesen können, und funktioniert nicht mehr, wenn Ihr Zugriff endet.'
