OpenSearch Dashboards is a program you run on your own computer to search and chart this organization's readings, which this server keeps in OpenSearch. It needs a login, made here, that is yours. It can read this organization's readings and nothing else, and the people of an organization share its saved dashboards. It needs permission to read the whole organization; if you can read only some projects, use the Grafana card instead.: OpenSearch Dashboards ist ein Programm, das Sie auf Ihrem eigenen Computer ausführen, um die Messwerte dieser Organisation zu durchsuchen und darzustellen, die dieser Server in OpenSearch speichert. Es braucht einen Login, der hier erstellt wird und Ihnen gehört. Es kann die Messwerte dieser Organisation lesen und nichts anderes, und die Mitglieder einer Organisation teilen sich deren gespeicherte Dashboards. Es braucht die Berechtigung, die ganze Organisation zu lesen; wenn Sie nur einige Projekte lesen können, verwenden Sie stattdessen die Grafana-Karte.
