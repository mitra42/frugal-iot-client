'Two credentials for two different connections: the password is what the MQTT bridge logs in with on port 8883, and the token is what lets that Pi pull this organization''s logins over HTTPS, so the same people can log in there too. The token can be skipped - press Enter at its prompt - and added later by doing this again. Neither is asked for on the command line, so that neither ends up in the Pi''s shell history.': 'Zwei Zugangsdaten für zwei verschiedene Verbindungen: Mit dem Passwort meldet sich die MQTT-Bridge auf Port 8883 an, und mit dem Token holt dieser Pi die Logins dieser Organisation über HTTPS ab, damit sich dieselben Personen auch dort anmelden können. Das Token kann übersprungen werden - drücken Sie an seiner Eingabeaufforderung die Eingabetaste - und später hinzugefügt werden, indem Sie dies wiederholen. Keines von beiden wird auf der Kommandozeile abgefragt, damit keines im Shell-Verlauf des Pi landet.'
