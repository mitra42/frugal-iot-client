'Sends the readings already recorded in the CSV files, which this forwarder did not see because it was off or OpenSearch was down. It is safe to repeat: a reading already there is replaced, not doubled.': 'Sendet die bereits in den CSV-Dateien aufgezeichneten Messwerte, die diese Weiterleitung nicht gesehen hat, weil sie ausgeschaltet oder OpenSearch nicht erreichbar war. Das kann gefahrlos wiederholt werden: Ein bereits vorhandener Messwert wird ersetzt, nicht verdoppelt.'
