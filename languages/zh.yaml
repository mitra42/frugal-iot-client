'Two credentials for two different connections: the password is what the MQTT bridge logs in with on port 8883, and the token is what lets that Pi pull this organization''s logins over HTTPS, so the same people can log in there too. The token can be skipped - press Enter at its prompt - and added later by doing this again. Neither is asked for on the command line, so that neither ends up in the Pi''s shell history.': 两个凭据用于两个不同的连接：密码是 MQTT 网桥在 8883 端口登录时使用的；令牌则让该 Pi 通过 HTTPS 拉取本组织的登录账户，以便同样的人也能在那里登录。令牌可以跳过——在其提示处按回车——之后再执行一次即可添加。两者都不通过命令行参数传入，因此都不会留在 Pi 的 shell 历史记录中。
