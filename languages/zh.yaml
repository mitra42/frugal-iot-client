'Sends the readings already recorded in the CSV files, which this forwarder did not see because it was off or OpenSearch was down. It is safe to repeat: a reading already there is replaced, not doubled.': 发送已记录在 CSV 文件中、但此转发器因关闭或 OpenSearch 宕机而未收到的读数。可以安全地重复执行：已存在的读数会被替换，而不会重复。
Only count them, send nothing: 只计数，不发送
Yours: 你的
Another user's: 其他用户的
'In Grafana, add a data source of type Infinity, with Authentication set to Bearer Token and the token above, and the allowed host above. Or let this do it:': 在 Grafana 中添加一个类型为 Infinity 的数据源，将 Authentication 设置为 Bearer Token 并填入上面的令牌，再填入上面的允许主机。或者让这里自动完成：
Download the data source file: 下载数据源文件
You have no login yet.: 你还没有登录账户。
Replace the password: 替换密码
Make a login: 创建登录账户
'Put these lines in the configuration file of the OpenSearch Dashboards on your computer (opensearch_dashboards.yml), then restart it. Nothing is asked for when you open it: the login is in the file. The password is not kept anywhere you can read it, so if you lose this, press the button below to make a new one and paste the lines in again.': 将以下几行写入你电脑上 OpenSearch Dashboards 的配置文件（opensearch_dashboards.yml），然后重启它。打开时无需输入任何内容：登录信息已在文件中。密码不会保存在任何你可以读取的地方，因此如果丢失，请点击下面的按钮重新生成，并再次粘贴这些行。
'Grafana can chart this organization''s readings straight from the server - every reading ever recorded, with nothing to export first. To set it up: install the Infinity plugin in Grafana, make a token here, give Grafana the data source, then import the dashboard. A token is yours: it lets one Grafana read what you can read in this organization, and stops working if your access to it does.': Grafana 可以直接从服务器绘制本组织的读数图表——包括有史以来记录的每一条读数，无需先导出。设置方法：在 Grafana 中安装 Infinity 插件，在这里生成令牌，为 Grafana 添加数据源，然后导入仪表板。令牌属于你：它让一个 Grafana 读取你在本组织中可以读取的内容，一旦你失去访问权限，它也随之失效。
