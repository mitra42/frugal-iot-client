Remove my login: 移除我的登录账户
Everyone's logins: 所有人的登录账户
OpenSearch Dashboards is a program you run on your own computer to search and chart this organization's readings, which this server keeps in OpenSearch. It needs a login, made here, that is yours. It can read this organization's readings and nothing else, and the people of an organization share its saved dashboards. It needs permission to read the whole organization; if you can read only some projects, use the Grafana card instead.: OpenSearch Dashboards 是一个在你自己的电脑上运行的程序，用于搜索本组织的读数并绘制图表，这些读数由本服务器保存在 OpenSearch 中。它需要一个在这里创建、属于你自己的登录账户。它只能读取本组织的读数，不能读取其他内容，同一组织的人共享其保存的仪表板。它需要读取整个组织的权限；如果你只能读取部分项目，请改用 Grafana 卡片。
Give a Grafana access: 授予 Grafana 访问权限
Name it for whoever or wherever it is, so it can be revoked on its own.: 按使用者或使用地点为其命名，以便可以单独撤销。
Make a token: 生成令牌
The starter dashboard: 入门仪表板
A chart with a list of every topic to pick from. In Grafana choose Dashboards, New, Import, upload this file, and pick the data source above when it asks.: 一个图表，附带可供选择的所有主题列表。在 Grafana 中依次选择 Dashboards、New、Import，上传此文件，并在询问时选择上面的数据源。
