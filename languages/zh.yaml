(Max 4MB, .bin only, typically frugal-iot.ino.bin or firmware.bin): （最大 4MB，仅限 .bin，通常为 frugal-iot.ino.bin 或 firmware.bin）
A bridge relays a Pi's readings to this server, so its nodes appear here too, while the Pi carries on recording and serving on its own whenever the link is down. "Bridge" is the broker's live view of the relay; "Last check-in" is when that Pi last collected this organization's logins, which it does over HTTP - so a Pi can be checking in while its bridge is down, and the two together say which half is broken.: 网桥将 Pi 的读数中继到此服务器，因此其节点也会显示在这里；而在链路中断时，Pi 会继续独立记录和提供服务。“网桥”是代理服务器对该中继的实时视图；“最后签到”是该 Pi 最后一次获取本组织登录账户的时间，这是通过 HTTP 进行的——因此 Pi 可能在网桥中断时仍在签到，两者结合可以判断是哪一半出了问题。
