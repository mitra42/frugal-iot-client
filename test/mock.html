<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frugal IoT — mock harness</title>
    <link href="../frugaliot.css" rel="stylesheet" type="text/css">
    <script type="importmap">
        {
        "imports": {
            "@kurkle/color": "/node_modules/@kurkle/color/dist/color.esm.js",
            "chart.js": "/node_modules/chart.js/dist/Chart.js",
            "dial-gauge": "/node_modules/dial-gauge/dial-gauge.js",
            "luxon": "/node_modules/luxon/src/luxon.js",
            "chartjs-adapter-luxon": "/node_modules/chartjs-adapter-luxon/dist/chartjs-adapter-luxon.esm.js",
            "csv-parse": "/node_modules/csv-parse/dist/esm/index.js",
            "esptool-js": "/node_modules/esptool-js/bundle.js"
            }
        }
    </script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f5f5f5; }
        #bar { position: sticky; top: 0; background: #007bff; color: white; padding: 8px 12px;
               display: flex; gap: 12px; align-items: center; flex-wrap: wrap; z-index: 10; }
        #bar select, #bar button { font-size: 1em; }
        #bar label { display: flex; gap: 4px; align-items: center; }
        #title { font-weight: bold; margin-right: auto; }
        #stage { padding: 12px; }
    #stage.cards { max-width: 1100px; }
        #note { padding: 0 12px 12px; color: #666; font-size: 0.9em; }
    #messages { padding: 0 12px 12px; font-size: 0.85em; }
    #messages summary { cursor: pointer; color: #666; }
    #messages pre { background: #fff; border: 1px solid #e3e3e3; border-radius: 4px;
                    padding: 8px; overflow-x: auto; margin: 6px 0 0; }
    </style>
</head>
<body>
<div id="bar">
    <span id="title">Mock harness</span>
    <label>Scenario <select id="scenario"></select></label>
    <label>View <select id="view">
        <option value="cards">cards</option>
        <option value="organization">organization map</option>
        <option value="tree">data tree only</option>
    </select></label>
    <button id="rerun">Re-run</button>
    <button id="forget" title="Clear the remembered card order and open/closed state">Forget layout</button>
</div>
<div id="note"></div>
<!-- What the scenario actually sent. When a card looks wrong the first question is always what it
     was told, so it is one click away rather than in the source. -->
<details id="messages"><summary>Messages in this scenario</summary><pre></pre></details>
<div id="stage"></div>
<pre id="tree" style="display:none;padding:12px;font-size:0.85em"></pre>

<script type="module">
  import { scenarios, loadConfig, runOrganization, runScenario, messagesOf } from './mock.js';
  import { snapshot } from './serialize.js';
  import '../cards.js';
  import { el, mqtt_deliver, setMqttClient } from '../core.js';

  // No broker, so act as one: a publish comes back to us as the broker would send it. No node
  // answers on the read path, so a location saved here moves its pin and stays Pending.
  setMqttClient({ connected: false, publish: (topic, payload) => {
    console.log('mock publish', topic, payload);
    setTimeout(() => mqtt_deliver(topic, payload), 0);
  } });

  // The fixture is generated from the real server schema - see fixtures/regenerate.js
  const config = await (await fetch('./fixtures/config.json')).json();
  loadConfig(config);

  const picker = document.getElementById('scenario');
  Object.entries(scenarios).forEach(([key, s]) =>
    picker.append(Object.assign(document.createElement('option'), { value: key, textContent: s.title })));

  // Replaced on every run, so a pick only ever reaches the map on screen
  let onLocationPick = null;
  document.addEventListener('frugaliot:locationpick', (e) => onLocationPick && onLocationPick(e));
  // What mqtt-dashboard does with Open project, as near as one project per scenario allows
  document.addEventListener('frugaliot:projectopen', (e) => {
    document.getElementById('view').value = 'cards';
    run();
    document.dispatchEvent(new CustomEvent('frugaliot:cardopen', { detail: { nodeId: e.detail.nodeId } }));
  });

  function run() {
    onLocationPick = null;
    const name = picker.value;
    const view = document.getElementById('view').value;
    const stage = document.getElementById('stage');
    const tree = document.getElementById('tree');
    stage.replaceChildren();
    stage.className = view;
    const messages = messagesOf(name);
    document.getElementById('note').textContent =
      `${messages.length} messages replayed with no broker.`;
    document.querySelector('#messages pre').textContent =
      messages.map(([topic, payload]) => `${topic} = ${payload}`).join('\n');

    if (view === 'organization') {
      // Every project in the scenario, as the organization page's map sees them - try located-organization
      const { organizationMt } = runOrganization(name);
      const mapEl = el('mqtt-map');
      stage.append(mapEl);
      mapEl.setProject(organizationMt);
      mapEl.open();
      document.getElementById('tree').style.display = 'none';
      location.hash = name;
      return;
    }

    // The cards read the data tree, so they need no elements of their own built for them
    const { projectMt } = runScenario(name);

    if (view === 'cards') {
      // The grid makes its own cards, in the order it remembers, and adds more as devices arrive
      const grid = el('mqtt-devicegrid');
      grid.mt = projectMt;   // Deliberately not projectMt.element - nothing is
      // Opened whenever a scenario has locations, so located-devices shows its pins without a click
      if (projectMt.locatedNodes.length) {
        const mapEl = el('mqtt-map');
        stage.append(mapEl);
        mapEl.setProject(projectMt);
        mapEl.open();
        // What mqtt-dashboard does with a card's 📍
        onLocationPick = (e) => {
          const nodeMt = projectMt.nodes[e.detail.nodeId];
          if (nodeMt) mapEl.pick(nodeMt);
        };
      }
      stage.append(grid);
    }
    tree.style.display = (view === 'tree') ? '' : 'none';
    if (view === 'tree') {
      tree.textContent = Object.values(projectMt.nodes).map((n) =>
        `${n.nodeId}  ${n.status}\n  summary: ${n.summaryChips.map((c) => c.text).join('  ')}\n` +
        n.frontRows.map((r) => `  ${r.kind.padEnd(9)}${(r.label || '').padEnd(20)}${r.mt ? r.mt.formatted : r.groupMt.summaryText()}`).join('\n')
      ).join('\n\n');
    }
    location.hash = name;
  }

  picker.value = location.hash.slice(1) in scenarios ? location.hash.slice(1) : Object.keys(scenarios)[0];
  picker.addEventListener('change', run);
  document.getElementById('view').addEventListener('change', run);
  document.getElementById('rerun').addEventListener('click', run);
  document.getElementById('forget').addEventListener('click', () => {
    try { Object.keys(localStorage).filter((k) => k.startsWith('frugaliot:layout:')).forEach((k) => localStorage.removeItem(k)); } catch (e) { /* no storage */ }
    run();
  });
  run();
</script>
</body>
</html>
