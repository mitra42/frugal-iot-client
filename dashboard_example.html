<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#007bff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Frugal IoT Dashboard">
    <link rel="apple-touch-icon" href="/images/icon-192x192.png">
    <link rel="manifest" href="/manifest.json">
    <title>Frugal IoT Control Dashboard</title>
    <link href="./frugaliot.css" rel="stylesheet" type="text/css">
    <script type="importmap">
        {
        "imports": {
            "@kurkle/color": "/node_modules/@kurkle/color/dist/color.esm.js",
            "chart.js": "/node_modules/chart.js/dist/Chart.js",
            "dial-gauge": "/node_modules/dial-gauge/dial-gauge.js",
            "luxon": "/node_modules/luxon/src/luxon.js",
            "chartjs-adapter-luxon": "/node_modules/chartjs-adapter-luxon/dist/chartjs-adapter-luxon.esm.js",
            "csv-parse": "/node_modules/csv-parse/dist/esm/index.js"
            }
        }
    </script>
    <script src="./webcomponents.js" type="module"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; margin: 0; background: #f5f5f5; }

        /* ── Header ── */
        #app-header {
            background: #007bff; color: white;
            padding: 10px 16px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
        }
        #app-title { margin: 0; font-size: 1.15em; font-weight: bold; }
        #settings-btn {
            background: transparent; border: 2px solid white; color: white;
            border-radius: 50%; width: 38px; height: 38px;
            font-size: 1.2em; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s, color 0.15s;
        }
        #settings-btn.active { background: white; color: #007bff; }

        /* ── Panels ── */
        .panel { padding: 12px; }
        .panel.hidden { display: none; }

        /* ── Cards ── */
        .card {
            background: white; border-radius: 8px; padding: 12px 14px;
            margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.1);
        }
        .card h3 { margin: 0 0 8px; font-size: 0.9em; color: #888; text-transform: uppercase; letter-spacing: 0.04em; }

        /* ── Waiting message ── */
        #waiting-msg { text-align: center; padding: 48px 20px; color: #666; }
        #waiting-msg p { font-size: 1.05em; margin-bottom: 12px; }
        #waiting-msg button {
            background: #007bff; color: white; border: none;
            padding: 8px 18px; border-radius: 4px; font-size: 1em; cursor: pointer;
        }

        /* ── Connection info ── */
        #connection-info { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 0.92em; }
        .info-label { color: #888; }
        .info-value { font-weight: bold; word-break: break-all; }

        /* ── Status indicator ── */
        #status-row { display: flex; align-items: center; gap: 12px; }
        #status-dot {
            width: 22px; height: 22px; border-radius: 50%;
            background: #ccc; border: 2px solid #aaa; flex-shrink: 0;
            transition: background 0.3s, border-color 0.3s;
        }
        #status-dot.on  { background: #2ecc71; border-color: #27ae60; }
        #status-dot.off { background: #e74c3c; border-color: #c0392b; }
        #status-text { font-size: 1.1em; font-weight: bold; color: #333; }

        /* ── Controls row ── */
        #dashboard-controls {
            display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px;
        }
        .ctrl-field { display: flex; flex-direction: column; }
        .ctrl-label { font-size: 0.78em; color: #666; font-weight: bold; margin-bottom: 3px; }
        /* mqtt-toggle in dashboard shows its own label (hidden by shadow CSS) - we add external labels */

        /* Constrain mqtt-text inputs in the controls row so limit + hysteresis fit on one line.
           --mqtt-val-width is a CSS custom property read inside the mqtt-text shadow DOM (frugaliot.css). */
        #dashboard-controls mqtt-text { --mqtt-text-val-width: 90px; }

        /* ── Settings panel: hide mqtt-wrapper's node display, show only org/project dropdowns ── */
        #settings-panel > mqtt-wrapper > mqtt-project { display: none !important; }
        #settings-panel > mqtt-wrapper > mqtt-client  { display: none !important; }

        /* ── Custom settings ── */
        #custom-settings { margin-top: 8px; }
        .settings-group-section {
            background: white; border-radius: 8px;
            padding: 12px 14px; margin-bottom: 10px;
            box-shadow: 0 1px 3px rgba(0,0,0,.1);
        }
        .settings-group-heading {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 10px;
        }
        .settings-node-name { font-weight: bold; font-size: 1em; }
        .settings-row {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 8px;
        }
        .settings-label { font-size: 0.9em; color: #555; width: 72px; flex-shrink: 0; }
        .settings-select { flex: 1; padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.92em; }
        .settings-empty { color: #888; font-size: 0.95em; padding: 8px 0; }
        .settings-intro {
            background: #e8f0fe; border-left: 4px solid #007bff;
            padding: 8px 12px; margin-bottom: 10px;
            border-radius: 0 6px 6px 0; font-size: 0.88em; color: #444;
        }
    </style>
</head>
<body>

<div id="app-header">
    <h1 id="app-title">Control Dashboard</h1>
    <button id="settings-btn" title="Settings" onclick="window._dashToggle()">⚙</button>
</div>

<!-- ═══ Dashboard panel ═══ -->
<div id="dashboard-panel" class="panel">

    <div id="waiting-msg">
        <p>No control module found yet.</p>
        <p>Open Settings and select your device.</p>
        <button onclick="window._dashToggle()">Open Settings ⚙</button>
    </div>

    <div id="dashboard-content" style="display:none">

        <!-- Sensor / actuator names -->
        <div class="card">
            <div id="connection-info">
                <span class="info-label">Sensor</span>
                <span class="info-value" id="sensor-name">—</span>
                <span class="info-label">Actuator</span>
                <span class="info-value" id="actuator-name">—</span>
            </div>
        </div>

        <!-- Status -->
        <div class="card">
            <div id="status-row">
                <div id="status-dot"></div>
                <span id="status-text">Status unknown</span>
            </div>
        </div>

        <!-- Sensor bar -->
        <div class="card" id="bar-container">
            <!-- mqtt-bar inserted by JS -->
        </div>

        <!-- Control parameters -->
        <div class="card">
            <h3>Control Parameters</h3>
            <div id="dashboard-controls">
                <!-- greater, limit, hysteresis inserted by JS -->
            </div>
        </div>

        <!-- History graph -->
        <div class="card">
            <h3>History</h3>
            <div id="graph-container">
                <!-- mqtt-graph inserted by JS -->
            </div>
        </div>

    </div>
</div>

<!-- ═══ Settings panel ═══ -->
<div id="settings-panel" class="panel hidden">
    <div class="settings-intro">
        Select organisation and project, then choose sensor and actuator below.
    </div>
    <!-- mqtt-wrapper: handles MQTT connection and org/project selection UI.
         The node/group details are hidden via CSS; we show our own simplified UI. -->
    <mqtt-wrapper></mqtt-wrapper>
    <!-- Custom control-group settings, built by JS after discovery -->
    <div id="custom-settings">
        <div id="custom-settings-groups"></div>
    </div>
</div>

<script type="module">
  //TODO rethink using any EL from the settings page, should just not build them and use the topic tree instead.
    /* ── Tab switching ── */
    let settingsOpen = false;
    window._dashToggle = function () {
        settingsOpen = !settingsOpen;
        document.getElementById('dashboard-panel').classList.toggle('hidden', settingsOpen);
        document.getElementById('settings-panel').classList.toggle('hidden', !settingsOpen);
        document.getElementById('settings-btn').classList.toggle('active', settingsOpen);
        if (settingsOpen) rebuildSettingsGroupsUI();
    };

    /* ── Helpers ── */
    function makeEl(tag, attrs) {
        // TODO can probably replace this with EL(tag, attrs, [])
        const el = document.createElement(tag);
        Object.entries(attrs).forEach(([k, v]) => { if (v !== null && v !== undefined) el.setAttribute(k, v); });
        return el;
    }

    function shortName(topicPath) {
        if (!topicPath) return null;
        const parts = topicPath.split('/');
        return parts.length >= 2 ? parts.slice(-2).join('/') : topicPath;
    }

    // Return a usable name for the path, or a short name if dont have sufficient info to get usableName
    function nameOf(group, wiredPath) {
        if (!wiredPath) return null;
        try {
            const topic = group && group.project && group.project.findTopic(wiredPath);
            if (topic && topic.usableName) return topic.usableName;
        } catch (e) { /* ignore */ }
        return shortName(wiredPath);
    }

    // Finds the mt so can send a message to its wiredPath
    // TODO add a findLeaf to group
    // TODO add wiredPath as getter  to element so callers of this can do e.g. group.findLeaf('now').wiredPath
    function getGroupChildMt(group, leaf) {
        for (const child of group.children) {
            if (child.mt && child.mt.leaf === leaf) return child.mt;
        }
        return null;
    }

    /* ── Dashboard state ── */
    let currentGroup = null; // An mqtt-groupcontrolhysteresis or mqtt-groupcontrolhysterisis, Set when things change and by looping through all control_hysteresis or control_hysterisis
    let groupAttrObserver = null;

    /* ── On/Off indicator ── */
    function updateOnOff() {
        if (!currentGroup) return;
        const on = currentGroup.state.on;
        const dot  = document.getElementById('status-dot');
        const text = document.getElementById('status-text');
        if (on === undefined || on === null) {
            dot.className = ''; text.textContent = 'Status unknown';  //TODO-TRANSLATE
        } else if (on) {
            dot.className = 'on'; text.textContent = 'ON'; //TODO-TRANSLATE
        } else {
            dot.className = 'off'; text.textContent = 'OFF';  //TODO-TRANSLATE
        }
    }

    /* ── Connection info ── */
    function updateConnectionInfo() {
        if (!currentGroup) return;
        const nowWired = currentGroup.state && currentGroup.state.now_wired;
        const outWired = currentGroup.state && currentGroup.state.out_wired;
        document.getElementById('sensor-name').textContent   = nameOf(currentGroup, nowWired)  || '—';
        document.getElementById('actuator-name').textContent = nameOf(currentGroup, outWired)  || '—';
    }

    /* ── Wire up the dashboard from a discovered control group ── */
    function wireUpDashboard(group) {
        currentGroup = group;

        /* Collect mt objects from group's child elements */
        let nowMt, outMt, greaterMt, limitMt, hystMt; /* onMt */
        Array.from(group.children).forEach(child => {
            if (!child.mt) return;
            switch (child.mt.leaf) { // TODO-add leaf as getter to Elements
                case 'now':         nowMt     = child.mt; break;
                case 'out':         outMt     = child.mt; break;
                case 'greater':     greaterMt = child.mt; break;
                case 'limit':       limitMt   = child.mt; break;
                case 'hysteresis':
                case 'hysterisis':  hystMt    = child.mt; break;
                //case 'on':          onMt      = child.mt; break; the child is "out" the status on Group is "on"
            }
        });

        const groupId        = group.getAttribute('group') || 'controlhysteresis'; // Should always exist
        const nodeTopicPath  = group.parentElement && group.parentElement.mt && group.parentElement.mt.topicPath; // Add getter on group to go to parent
        const nowWired       = group.state.now_wired;
        const outWired       = group.state.out_wired;

        /* Resolve sensor topic and range */
        let sensorTopic = (nowMt && nowMt.topicPath) || `${nodeTopicPath}/${groupId}/now`;
        let barMin = 0, barMax = 100; // just defaults
        // Look for min and max on the topic we are wired to
        if (nowWired) {
            try {
                const sensorMt = group.project && group.project.findTopic(nowWired);
                if (sensorMt) {
                    sensorTopic = sensorMt.topicPath;
                    barMin = sensorMt.min != null ? sensorMt.min : 0;
                    barMax = sensorMt.max != null ? sensorMt.max : 100;
                } else {
                    sensorTopic = nowWired;
                }
            } catch (e) { sensorTopic = nowWired; }
        } else if (nowMt) {
            barMin = nowMt.min != null ? nowMt.min : 0;
            barMax = nowMt.max != null ? nowMt.max : 100;
        }

        const outTopic     = (outMt     && outMt.topicPath)      || (nodeTopicPath && `${nodeTopicPath}/${groupId}/out`);
        const greaterTopic = (greaterMt && greaterMt.topicPath)  || `${nodeTopicPath}/${groupId}/greater`;
        const limitTopic   = (limitMt   && limitMt.topicPath)    || `${nodeTopicPath}/${groupId}/limit`;
        const hystLeaf     = (hystMt    && hystMt.leaf)          || 'hysteresis';
        const hystTopic    = (hystMt    && hystMt.topicPath)     || `${nodeTopicPath}/${groupId}/${hystLeaf}`;

        /* Names */
        const sensorName   = nameOf(group, nowWired) || 'Sensor';
        const actuatorName = nameOf(group, outWired) || 'Actuator';

        /* App title from node */
        const node = group.parentElement;
        const nodeName = node ? node.usableName : "Dashboard";
        // A node always has a usableName, no need to repeat logic here ...
        /*
        const nodeName = (node && node.state && (node.state.name || node.state.id))
                         || (nodeTopicPath && nodeTopicPath.split('/').pop())
                         || 'Dashboard';
        */
        document.getElementById('app-title').textContent = nodeName;

        /* Show dashboard */
        document.getElementById('waiting-msg').style.display = 'none';
        document.getElementById('dashboard-content').style.display = '';
        updateConnectionInfo();

        /* ── Bar ── */
        const barContainer = document.getElementById('bar-container');
        barContainer.innerHTML = '';
        // TODO I think should use sensorTopic.createElement() in which case some of the attributes used below may not be needed
        barContainer.appendChild(makeEl('mqtt-bar', {
            topic: sensorTopic,
            label: sensorName,
            type:  'float',
            color: 'steelblue',
            min:   String(barMin),
            max:   String(barMax),
        }));

        /* ── Controls ── */
        const controlsEl = document.getElementById('dashboard-controls');
        controlsEl.innerHTML = '';
        // TODO compact this into >< limit +- hysteresis, then possibly back-port to webcomponents
        // This might just be the el's with some CSS
        function addCtrl(labelText, el) {
            const w = document.createElement('div');
            w.className = 'ctrl-field';
            //const lbl = document.createElement('div');
            //lbl.className = 'ctrl-label';
            //lbl.textContent = labelText;
            //w.appendChild(lbl);
            w.appendChild(el);
            controlsEl.appendChild(w);
        }

        /* Direction: dropdown showing < or > instead of a checkbox */
        addCtrl('', makeEl('mqtt-toggle', { topic: greaterTopic, label: '', type: 'bool', labels: '<,>' }));

        /* Limit */
        addCtrl('Limit', makeEl('mqtt-text', { topic: limitTopic, label: '', type: 'float', color: 'orange' }));

        /* ± Hysteresis */
        addCtrl('±', makeEl('mqtt-text', { topic: hystTopic, label: '±', type: 'float', color: '#666' }));

        /* ── Graph ── */
        const graphContainer = document.getElementById('graph-container');
        graphContainer.innerHTML = '';
        // TODO in MqttGraph.graph look for `graph-container` and put a graph there it will then be used by topic.createGraph
        // TODO then becomes unneccessary to create here
        const graph = document.createElement('mqtt-graph');
        // TODO probably just use sensorTopic.createGraph() but check how it gets the dataset
        graph.appendChild(makeEl('mqtt-graphdataset', {
            topic: sensorTopic,
            type:  'float',
            color: 'steelblue',
            label: sensorName,
            min:   String(barMin),
            max:   String(barMax),
        }));

        // TODO just use outTopic.createGraph()
        if (outTopic) graph.appendChild(makeEl('mqtt-graphdataset', {
            topic: outTopic,
            type:  'bool',
            color: 'orange',
            label: actuatorName,
        }));

        // TODO this becomes unneeded if creating graph in it via MqttGraph.graph
        graphContainer.appendChild(graph);

        /* ── Watch group attributes for live updates ── */
        if (groupAttrObserver) groupAttrObserver.disconnect();
        groupAttrObserver = new MutationObserver((mutations) => {
          // TODO add break here and understand how MutationObserver works
            const wiringChanged = mutations.some(m =>
                m.attributeName === 'now_wired' || m.attributeName === 'out_wired'
            );
            if (wiringChanged) {
                wireUpDashboard(currentGroup); // rebuild bar/graph with real sensor topic
            } else {
                updateOnOff();
                updateConnectionInfo();
            }
        });
        groupAttrObserver.observe(group, { attributes: true });

        updateOnOff();
        rebuildSettingsGroupsUI();
    }

    /* ── Build simplified settings: one section per control group ── */
    function rebuildSettingsGroupsUI() {
        domObserver.disconnect();
        try { _doRebuildSettingsGroupsUI(); } finally {
            domObserver.observe(settingsPanel, { childList: true, subtree: true });
        }
    }
    function _doRebuildSettingsGroupsUI() {
        const container = document.getElementById('custom-settings-groups');
        if (!container) return;
        container.innerHTML = '';

        // TODO check if this is just returning one, or both
        const allGroups = Array.from(document.querySelectorAll(
            '#settings-panel mqtt-groupcontrolhysteresis, #settings-panel mqtt-groupcontrolhysterisis'
        ));

        if (allGroups.length === 0) {
            const p = document.createElement('p');
            p.className = 'settings-empty';
            p.textContent = 'No control modules found yet. Select organisation and project above.';
            container.appendChild(p);
            return;
        }

        // REVIEW FROM HERE ===========
        // TODO do this already in webcomponents but on a topic and don't have that here.
        /* Collect all available sensor and actuator topics from all nodes in the project */
        const allNodes    = Array.from(document.querySelectorAll('#settings-panel mqtt-node'));
        // TODO at least use allowableTypes from webcomponents
        const sensors     = allNodes.flatMap(n => n.topicsByType(['float', 'int', 'exponential'], 'r'));
        const actuators   = allNodes.flatMap(n => n.topicsByType(['bool'], 'w'));

        allGroups.forEach((group, idx) => {
            const node     = group.parentElement;
            const nodeName = (node && node.state && (node.state.name || node.state.id)) || 'Unknown node';
            const isActive = (group === currentGroup);

            const section = document.createElement('div');
            section.className = 'settings-group-section';

            /* Heading: radio (if multiple) + node name */ // TODO doesnt appear to do radio
            const heading = document.createElement('div');
            heading.className = 'settings-group-heading';

            if (allGroups.length > 1) {
                const radio = document.createElement('input');
                radio.type    = 'radio';
                radio.name    = 'active-group';
                radio.value   = String(idx);
                radio.checked = isActive;
                radio.onchange = () => wireUpDashboard(group);
                heading.appendChild(radio);
            }

            const nameSpan = document.createElement('span');
            nameSpan.className   = 'settings-node-name';
            nameSpan.textContent = nodeName;
            heading.appendChild(nameSpan);
            section.appendChild(heading);

            /* Sensor dropdown */
            const currentNowWired = group.state && group.state.now_wired;
            section.appendChild(buildWiringRow('Sensor', sensors, currentNowWired, false, (value) => {
                // When row is changed, value is the path to the sensor, and this function will set the wiredPath of the control to the sensor
                // TODO see note on getGroupChildMt replace with
                /* topicWiredPath = group.findLeaf('now').wiredPath
                    if (topicWiredPath) {  document.dispatchEvent ... }
                 */
                const mt = getGroupChildMt(group, 'now');
                if (mt) document.dispatchEvent(new CustomEvent('frugaliot:publish', {
                    detail: { topic: mt.topicWiredPath, value, options: {retain: true, qos: 1} }
                }));
            }));

            /* Actuator dropdown — 'out' is rw='r' so we publish the actuator's setTopic */
            const currentOutWired = group.state && group.state.out_wired;
            section.appendChild(buildWiringRow('Actuator', actuators, currentOutWired, true, (value) => {
              // TODO see note on getGroupChildMt replace with
              /* topicWiredPath = group.findLeaf('now').wiredPath
                    if (topicWiredPath) {  document.dispatchEvent ... }
              */
              // When row is changed, value is the path to the sensor, and this function will set the wiredPath of the control to the sensor
              const mt = getGroupChildMt(group, 'out');
                if (mt) document.dispatchEvent(new CustomEvent('frugaliot:publish', {
                    detail: { topic: mt.topicWiredPath, value, options: {retain: true, qos: 1} }
                }));
            }));

            container.appendChild(section);
        });
    }

    /* Build a labeled dropdown row for sensor/actuator wiring.
       useSetTopic: true for actuators (out is rw='r', so we wire to the SET topic of the actuator) */
    function buildWiringRow(labelText, topicList, currentValue, useSetTopic, onChange) {
      // TODO use el()
        const row = document.createElement('div');
        row.className = 'settings-row';

        const lbl = document.createElement('label');
        lbl.className   = 'settings-label';
        lbl.textContent = labelText;

        const sel = document.createElement('select');
        sel.className = 'settings-select';

        const none = document.createElement('option');
        none.value = ''; none.textContent = 'Not connected';
        sel.appendChild(none);

        topicList.forEach(t => {
            const opt = document.createElement('option');
            const publishValue = useSetTopic ? t.setTopic : t.topic;
            opt.value = publishValue;
            opt.textContent = t.name;
            opt.selected = (publishValue === currentValue || t.topic === currentValue || t.setTopic === currentValue);
            sel.appendChild(opt);
        });

        sel.onchange = (e) => { if (e.target.value) onChange(e.target.value); };

        row.appendChild(lbl);
        row.appendChild(sel);
        return row;
    }

    /* ── Watch settings panel for control groups appearing ── */
    const settingsPanel = document.getElementById('settings-panel');
    const domObserver = new MutationObserver(() => {
      // TODO I think this always just finds th efirst one as not using result of MutationObserver
        const group = document.querySelector(
            '#settings-panel mqtt-groupcontrolhysteresis, #settings-panel mqtt-groupcontrolhysterisis'
        );
        if (group && group !== currentGroup) {
            wireUpDashboard(group);
            if (settingsOpen) rebuildSettingsGroupsUI();
        }
    });
    domObserver.observe(settingsPanel, { childList: true, subtree: true });
</script>

</body>
</html>
